<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Carrò · Menu e Sommelier</title>
<style>
:root{--bg:#f4efe0;--card:#fffdf6;--tx:#2b2a1f;--mut:#6d6a58;--gold:#d4a017;--ol:#5b6b1f;--bd:#e4dcc2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1f14;--card:#2a2c1e;--tx:#f1ecd8;--mut:#b4b09a;--bd:#454833}}
:root[data-theme="dark"]{--bg:#1d1f14;--card:#2a2c1e;--tx:#f1ecd8;--mut:#b4b09a;--bd:#454833}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4}
main{max-width:560px;margin:0 auto;padding:12px 14px 40px}
h1{font-size:20px;margin:6px 0 2px;text-align:center}
.sub{text-align:center;color:var(--mut);font-size:13px;margin-bottom:10px}
.lang{display:flex;justify-content:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
button{font-family:inherit}
.lang button,.tabs button{border:1px solid var(--gold);background:transparent;color:var(--tx);border-radius:20px;padding:5px 12px;font-size:13px;cursor:pointer}
.lang button.on,.tabs button.on{background:var(--gold);color:#fff;font-weight:600}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:2}
.tabs button{white-space:nowrap}.hd{background:#1d1f14;border-radius:14px;padding:10px 14px;margin:2px 0 8px}.hd img{display:block;max-width:100%;height:auto;max-height:120px;margin:0 auto}.stk{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-top:4px}.stk.adm{position:static}.stk .tabs{position:static;padding:2px 0 8px}.stk .bar button{padding:11px}.lang:empty{display:none}#top{display:contents}#list{padding-bottom:30vh}.cath{font-size:16px;margin:20px 0 10px;color:var(--ol);scroll-margin-top:64px;text-transform:uppercase;letter-spacing:.04em}.dish[data-i]{cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}.pick:disabled{opacity:.3}
.dish{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.dish.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.dish.off{opacity:.55;border-style:dashed}
.row{display:flex;justify-content:space-between;gap:8px;font-weight:700;text-transform:uppercase;font-size:14px}
.price{color:var(--gold);white-space:nowrap}
.d{font-size:13px;color:var(--mut);margin:3px 0 8px}
.pick{border:1px solid var(--gold);background:transparent;color:var(--gold);border-radius:20px;padding:3px 12px;font-size:12px;cursor:pointer;margin:2px 2px 2px 0}
.sel .pick,.pick.on{background:var(--gold);color:#fff}
.bar{display:flex;gap:8px;padding:6px 0}
.bar button{flex:1;max-width:560px;border:0;border-radius:12px;padding:14px;font-size:15px;font-weight:700;background:var(--gold);color:#fff;cursor:pointer}
.bar button.sec{flex:0 0 auto;background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.bar button:disabled{opacity:.55}
.res{background:var(--card);border:2px solid var(--ol);border-radius:14px;padding:14px;margin:6px 0 16px}
.res h2{margin:0 0 8px;font-size:16px;color:var(--ol)}
.w{padding:10px 0;border-top:1px solid var(--bd)}.w:first-of-type{border-top:0}
.wn{font-weight:700}.wm{font-size:13px;color:var(--mut)}
.badge{display:inline-block;font-size:11px;background:var(--ol);color:#fff;border-radius:10px;padding:1px 8px;margin-right:6px}
.form{background:var(--card);border:2px solid var(--gold);border-radius:12px;padding:12px;margin-bottom:12px}
.form h3{margin:0 0 8px;font-size:15px}
.form input,.form select{width:100%;margin-bottom:8px;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:15px}
.sw{font-size:13px;display:inline-flex;align-items:center;gap:6px;margin-right:8px}
.msg{font-size:13px;color:var(--mut);text-align:center;margin:6px 0}
</style></head><body><main>

<script>
const SRC="<!DOCTYPE html>"+document.documentElement.outerHTML;
const DB=JSON.parse(document.getElementById("data").textContent);
const S={it:{sub:"Scegli i piatti, ti consigliamo il vino",sel:"Seleziona",on:"Selezionato",go:"Consiglia il vino",none:"Seleziona almeno un piatto per l'abbinamento",title:"Il nostro sommelier consiglia",card:"In carta si abbina a",glass:"al calice",cat:["Per iniziare","Primi","Brace","Pesce","Pizze","Dolci"],b:["Più indicato","Alternativa","Per una scelta diversa"],nw:"Nessun abbinamento trovato."},
en:{sub:"Pick your dishes, we suggest the wine",sel:"Select",on:"Selected",go:"Suggest a wine",none:"Select at least one dish for the pairing",title:"Our sommelier suggests",card:"On our list it goes with",glass:"by the glass",cat:["Starters","First courses","Grill","Fish","Pizzas","Desserts"],b:["Best match","Alternative","A different choice"],nw:"No pairing found."}};
const TAGS=["antipasto","salumi","formaggi","terra","mare","fritto","griglia","brace","pizza","dolce"];
let L="it",C=0,sel=new Set(),CAN=false,ADM=false,art=null,AT="D",ED=null,dirty=0,msg="";
const $=i=>document.getElementById(i),t=()=>S[L],fm=p=>String(p).replace(".",","),
 esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const find=id=>DB.D.find(x=>x.id===id)||DB.W.find(x=>x.id===id);
function bar(){
 const b=$("bar");
 if(ADM){b.innerHTML=`<button class="sec" data-a="undo">Annulla</button><button data-a="pub" ${dirty?"":"disabled"}>Pubblica modifiche${dirty?" ("+dirty+")":""}</button>`;return}
 const s=t(),n=sel.size;b.innerHTML=`<button data-a="go" ${n?"":"disabled"}>${n?s.go+" ("+n+")":s.none}</button>`;
}
function draw(){
 const s=t();$("sub").textContent=ADM?"Modalità gestione: le modifiche si vedono ai clienti solo dopo «Pubblica»":s.sub;
 $("lang").innerHTML=CAN?`<button data-a="adm" class="${ADM?"on":""}">${ADM?"Esci dalla gestione":"⚙ Gestione"}</button>`:"";$("stk").classList.toggle("adm",ADM);
 $("res").innerHTML=ADM?"":$("res").innerHTML;
 ADM?admin():cust();bar();
}
function cust(){
 const s=t(),ids=s.cat.map((c,i)=>i).filter(i=>DB.D.some(d=>d.v&&d.c===i));
 if(!ids.includes(C))C=ids[0]||0;
 $("top").innerHTML=`<div class="tabs">`+ids.map(i=>`<button class="${i===C?"on":""}" data-c="${i}">${s.cat[i]}</button>`).join("")+`</div>`;
 $("list").innerHTML=ids.map(i=>`<h2 class="cath" id="cat${i}">${s.cat[i]}</h2>`+DB.D.filter(d=>d.v&&d.c===i).map(d=>`<div class="dish ${sel.has(d.id)?"sel":""}" data-i="${d.id}"><div class="row"><span>${esc(d.n)}</span><span class="price">€${fm(d.p)}</span></div><div class="d">${esc(d.d)}</div><button class="pick">${sel.has(d.id)?s.on:s.sel}</button></div>`).join("")).join("");
}
function admin(){
 const k=AT,e=ED||{},isD=k==="D",cats=S.it.cat;
 $("top").innerHTML=`<div class="tabs"><button data-at="D" class="${isD?"on":""}">Piatti</button><button data-at="W" class="${isD?"":"on"}">Vini</button></div>`+
 `<div class="form"><h3>${ED&&ED.id?"Modifica":"Aggiungi"} ${isD?"piatto":"vino"}</h3>
 <input id="f-n" placeholder="Nome" value="${esc(e.n)}"><input id="f-p" type="number" step="0.5" placeholder="Prezzo €" value="${esc(e.p)}">`+
 (isD?`<select id="f-c">${cats.map((c,i)=>`<option value="${i}" ${e.c===i?"selected":""}>${c}</option>`).join("")}</select><input id="f-d" placeholder="Descrizione (facoltativa)" value="${esc(e.d)}">`
 :`<input id="f-z" placeholder="Zona / denominazione" value="${esc(e.z)}"><input id="f-a" placeholder="Abbinamento in carta" value="${esc(e.a)}"><label class="sw"><input type="checkbox" id="f-g" ${e.g?"checked":""}> Al calice</label>`)+
 `<div class="d">Si abbina con (serve al sommelier):</div>`+TAGS.map(g=>`<button class="pick ${(e.t||[]).includes(g)?"on":""}" data-tg="${g}">${g}</button>`).join("")+
 `<div style="margin-top:8px"><button class="pick on" data-a="save">Salva</button>${ED?`<button class="pick" data-a="cancel">Annulla</button>`:""}</div></div>`+
 `<div class="msg">${esc(msg)}</div>`;
 const ord=DB[k].map((x,i)=>i);if(isD)ord.sort((p,q)=>DB.D[p].c-DB.D[q].c||p-q);
 $("list").innerHTML=ord.map(i=>{const x=DB[k][i];return `<div class="dish ${x.v?"":"off"}"><div class="row"><span>${esc(x.n)}</span><span class="price">€${fm(x.p)}</span></div><div class="d">${esc(isD?cats[x.c]:x.z)}</div><label class="sw"><input type="checkbox" data-vis="${x.id}" ${x.v?"checked":""}> Visibile ai clienti</label><button class="pick" data-mv="${x.id}" data-dir="-1" ${nbr(x.id,-1)<0?"disabled":""}>▲ Su</button><button class="pick" data-mv="${x.id}" data-dir="1" ${nbr(x.id,1)<0?"disabled":""}>▼ Giù</button><button class="pick" data-ed="${x.id}">Modifica</button><button class="pick" data-del="${x.id}">Elimina</button></div>`}).join("");
}
function readForm(){
 if(!$("f-n"))return;ED=ED||{t:[]};
 ED.n=$("f-n").value.trim();ED.p=parseFloat($("f-p").value);
 if(AT==="D"){ED.c=+$("f-c").value;ED.d=$("f-d").value.trim()}else{ED.z=$("f-z").value.trim();ED.a=$("f-a").value.trim();ED.g=$("f-g").checked?1:0}
}
function save(){
 readForm();if(!ED||!ED.n||isNaN(ED.p)){msg="Inserisci almeno nome e prezzo.";draw();return}
 const arr=DB[AT];
 if(ED.id){const i=arr.findIndex(x=>x.id===ED.id),oc=arr[i].c;arr[i]=Object.assign(arr[i],ED);if(AT==="D"&&oc!==arr[i].c){arr.push(arr.splice(i,1)[0])}}
 else{if(AT==="D"&&ED.c==null)ED.c=0;ED.id="n"+(DB.n++);ED.v=1;ED.t=ED.t||[];arr.push(ED)}
 ED=null;dirty++;msg="Salvato nella bozza. Ricorda di premere «Pubblica modifiche».";draw();
}
function build(){
 const a='<script id="da'+'ta" type="application/json">',i=SRC.indexOf(a)+a.length,j=SRC.indexOf('<\/script>',i);
 return SRC.slice(0,i)+JSON.stringify(DB).replace(/</g,"\\u003c")+SRC.slice(j);
}
async function pub(){
 try{msg="Pubblicazione in corso…";draw();await art.publish(build())}
 catch(e){msg="Pubblicazione non riuscita ("+((e&&e.code)||"errore")+"). Riprova.";draw()}
}
function pair(){
 const sc=DB.W.filter(w=>w.v).map(w=>{let p=0;sel.forEach(id=>{const d=find(id);if(d&&d.v)d.t.forEach(x=>{if(w.t.includes(x))p++})});return{w,p}}).filter(x=>x.p>0);
 sc.sort((a,b)=>b.p-a.p||a.w.p-b.w.p);
 const top=sc.slice(0,3),s=t();
 $("res").innerHTML=`<div class="res"><h2>${s.title}</h2>`+(top.length?top.map((x,k)=>`<div class="w"><span class="badge">${s.b[k]}</span><span class="wn">${esc(x.w.n)}</span> <span class="price">€${fm(x.w.p)}${x.w.g?" · "+s.glass:""}</span><div class="wm">${esc(x.w.z)}</div>${x.w.a?`<div class="wm">${s.card}: ${esc(x.w.a)}</div>`:""}</div>`).join(""):s.nw)+`</div>`;
 scrollTo({top:0,behavior:"smooth"});
}
function nbr(id,dir){const arr=DB[AT],i=arr.findIndex(x=>x.id===id);if(i<0)return -1;let j=i+dir;while(j>=0&&j<arr.length&&AT==="D"&&arr[j].c!==arr[i].c)j+=dir;return j<0||j>=arr.length?-1:j}
function mv(id,dir){const j=nbr(id,dir);if(j<0)return;const arr=DB[AT],i=arr.findIndex(x=>x.id===id);[arr[i],arr[j]]=[arr[j],arr[i]];dirty++}
function go(i){const el=$("cat"+i);if(el)window.scrollTo({top:el.getBoundingClientRect().top+scrollY-$("stk").offsetHeight-6,behavior:"smooth"})}
function spy(){if(ADM)return;const hs=[...document.querySelectorAll(".cath")];if(!hs.length)return;let k=+hs[0].id.slice(3);hs.forEach(h=>{if(h.getBoundingClientRect().top<=$("stk").offsetHeight+16)k=+h.id.slice(3)});if(innerHeight+scrollY>=document.documentElement.scrollHeight-4)k=+hs[hs.length-1].id.slice(3);if(k!==C){C=k;document.querySelectorAll(".tabs button").forEach(x=>{const on=+x.dataset.c===k;x.classList.toggle("on",on);if(on)x.scrollIntoView({inline:"center",block:"nearest"})})}}
addEventListener("scroll",spy,{passive:true});
document.addEventListener("click",e=>{
 const cd=!ADM&&e.target.closest(".dish[data-i]");
 if(cd){const i=cd.dataset.i;sel.has(i)?sel.delete(i):sel.add(i);cd.classList.toggle("sel",sel.has(i));cd.querySelector(".pick").textContent=sel.has(i)?t().on:t().sel;bar();return}
 const b=e.target.closest("button");if(!b)return;const d=b.dataset;
 if(d.l){L=d.l;$("res").innerHTML=""}
 else if(d.c){go(+d.c);return}
 else if(d.i){sel.has(d.i)?sel.delete(d.i):sel.add(d.i)}
 else if(d.at){AT=d.at;ED=null;msg=""}
 else if(d.tg){readForm();ED=ED||{t:[]};const i=ED.t.indexOf(d.tg);i<0?ED.t.push(d.tg):ED.t.splice(i,1)}
 else if(d.ed){const x=find(d.ed);ED=JSON.parse(JSON.stringify(x));scrollTo({top:0,behavior:"smooth"})}
 else if(d.del){DB[AT]=DB[AT].filter(x=>x.id!==d.del);dirty++;msg=""}
 else if(d.mv){mv(d.mv,+d.dir);draw();const m=document.querySelector('[data-mv="'+d.mv+'"]');if(m)m.scrollIntoView({block:"center"});return}
 else if(d.a==="go"){pair();return}
 else if(d.a==="adm"){ADM=!ADM;ED=null;msg=""}
 else if(d.a==="save"){save();return}
 else if(d.a==="cancel"){ED=null}
 else if(d.a==="pub"){pub();return}
 else if(d.a==="undo"){location.reload();return}
 draw();
});
document.addEventListener("change",e=>{
 const v=e.target.dataset.vis;if(!v)return;
 find(v).v=e.target.checked?1:0;dirty++;draw();
});
draw();
(async()=>{try{
 if(!window.claude)return;
 const u=await claude.use("user");
 if(u&&(u.isOwner()||u.canEdit())){art=await claude.use("artifact");if(art){CAN=true;draw()}}
}catch(e){}})();
</script></body></html>
